# T-31 - the aggregation degradations, as sentences rather than as raw symbols.
#
# `_degradations.html.erb` used to print `Degradation#to_s`: a code and an English sentence
# built in `lib/`. These eight keys are the codes T-31 introduced or inherited on that path;
# the remaining degradation codes still print raw and that gap is §Findings S-17, with the
# mechanism (a key per code, `data` as interpolation, `to_s` as the fallback) settled here.
#
# THE PLACEHOLDERS ARE THE DEGRADATION'S OWN `data` KEYS and are identical in all nine files.
# A key whose placeholder does not match its emit site raises
# `I18n::MissingInterpolationArgument`, which `reporter_degradation_text` catches into the raw
# fallback - so a mistake here loses the translation, never the message.

  text_reporter_degradation_aggregation_group_by_required: "A spent-time report cannot be summarised without a dimension. Add group_by: to the aggregation tag — for example group_by: activity."
  text_reporter_degradation_aggregation_dimension_unknown: "%{group_by} is not something a spent-time report can be grouped by."
  text_reporter_degradation_aggregation_measure_unknown: "%{measure} is not something a spent-time report can measure."
  text_reporter_degradation_aggregation_dimension_unavailable: "Grouping by %{group_by} needs each entry linked to its issue, which only a saved spent-time query provides. Pick one for this report."
  text_reporter_degradation_aggregation_sort_unsupported: "Sorting by %{sort} is not available for spent time, so the buckets are ordered by size."
  text_reporter_degradation_aggregation_axis_truncated: "%{group_by} has too many values to show: %{kept} are listed and %{folded} were folded together."
  text_reporter_degradation_aggregation_params_unsupported: "%{params} cannot be used in a spent-time report. The rest of the aggregation was computed."
  text_reporter_degradation_aggregation_source_unsupported: "The data source of this report (%{source}) cannot be summarised by %{tag}."
  text_reporter_degradation_legacy_engine: "Drawn by wkhtmltopdf, a compatibility engine scheduled for removal; modern CSS is not supported."
  text_reporter_degradation_asset_structural_fallback: "A file was embedded in an alternative form, because embedding it directly would have changed what the document means."
  text_reporter_degradation_asset_srcset_collapsed: "Only the first of several image sizes was used: a printed page has a single resolution."
  text_reporter_degradation_asset_nested_depth: "A stylesheet imported others more deeply than is allowed; the deepest import was not embedded."
  text_reporter_degradation_asset_inline_oversize: "A file above the embedding threshold was embedded anyway, because this render engine cannot carry files alongside the document."
  text_reporter_degradation_asset_document_cap: "This report refers to more files than can be embedded in one document; the rest were left out."

