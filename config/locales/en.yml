  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Render preflight"
  text_reporter_preflight_intro: "Renders a probe document through every installed render engine and reports what actually arrived in the PDF: page breaks, the page-number footer, background colours, an inline image and the JavaScript path. These are the questions that a present, healthy engine can still answer wrongly."
  text_reporter_preflight_takes_a_moment: "This starts a real engine and waits for a real document, so it takes a few seconds per engine."
  button_reporter_preflight_run: "Run preflight"
  text_reporter_preflight_no_engine: "No render engine is registered, so nothing was verified. No report can be produced in this state."
  text_reporter_preflight_ok: "Every check passed."
  text_reporter_preflight_problems: "%{count} check(s) failed."
  text_reporter_preflight_incomplete: "Nothing failed, but %{count} check(s) could not run. See the details below."
  label_reporter_preflight_engine_version: "Engine version"
  label_reporter_preflight_duration: "Duration"
  label_reporter_preflight_state: "State"
  label_reporter_preflight_check: "Check"
  label_reporter_preflight_detail: "Details"
  label_reporter_preflight_state_pass: "Passed"
  label_reporter_preflight_state_fail: "Failed"
  label_reporter_preflight_state_skip: "Could not run"
  label_reporter_preflight_state_expected_failure: "Expected failure"
  label_reporter_preflight_duration_ms: "%{count} ms"
  label_reporter_preflight_json: "The report as JSON"
  text_reporter_preflight_json: "Copy this into a bug report — it says exactly what ran and what came back."
  label_reporter_preflight_check_engine: "The render engine produced a document"
  label_reporter_preflight_check_degradations: "Nothing was silently degraded"
  label_reporter_preflight_check_page_breaks: "Page breaks produce more than one page"
  label_reporter_preflight_check_footer: "The page-number footer is compiled and numbered"
  label_reporter_preflight_check_background: "Backgrounds are printed, so badges keep their colour"
  label_reporter_preflight_check_inline_asset: "An inline image decodes to the right colour"
  label_reporter_preflight_check_javascript: "The JavaScript path runs, so charts can draw"
  label_reporter_preflight_check_readiness: "The readiness shell loads, so a chart-free page does not wait"
  label_reporter_preflight_check_hosted_asset: "A Redmine-hosted image is blocked (expected: the renderer has no network access)"
  label_reporter_asset_policy: "Asset policy"
  label_reporter_asset_policy_bundled: "Bundled \u2014 nothing is fetched over the network (default)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 fetch from this install only"
  label_reporter_asset_policy_external: "External \u2014 fetch from allowlisted hosts only"
  text_reporter_asset_policy_info: "How the images, stylesheets, fonts and scripts a report references are obtained. Bundled reads them from disk and embeds them, so the render engine never touches the network. The other two are settings for this install and never for a template: a report author cannot widen them by editing a document."
  label_reporter_asset_allowlist: "Asset host allowlist"
  text_reporter_asset_allowlist_info: "One host name per line. Host names only \u2014 no scheme, no port, no path and no wildcards. Leaving this empty makes every policy behave exactly as Bundled, so a half-finished configuration cannot open network access by accident."
  label_reporter_asset_inline_max_bytes: "Embed assets up to (bytes)"
  text_reporter_asset_inline_max_bytes_info: "Above this size an asset travels alongside the document instead of being embedded in it, on engines that support that. This is a cost setting, not a limit."
  label_reporter_asset_max_bytes: "Refuse assets above (bytes)"
  text_reporter_asset_max_bytes_info: "A hard limit. An asset larger than this is refused and the report names it, rather than being rendered with a gap in it."
  text_reporter_asset_policy_collapsed: "The asset host allowlist is empty, so %{mode} currently behaves exactly as Bundled and nothing is fetched over the network. Add at least one host name for it to take effect."
  text_reporter_asset_settings_dropped: "Some saved values could not be used, and the defaults are in force instead:"

# T-22 - model attribute labels. Redmine's human_attribute_name tries
# field_<class_prefix>_<attr> before field_<attr>, and the class-prefixed form is used
# throughout: a bare field_visibility would relabel Redmine's own saved queries too,
# which is not this plugin's to change.
