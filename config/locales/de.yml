  button_reporter_template_import: "Importieren"
  text_reporter_template_output_info: "Ein Dokument pro Ticket erzeugt für jedes Ticket im Bereich ein eigenes PDF; ein Dokument für die gesamte Menge erzeugt ein einziges PDF."
  text_reporter_template_source_info: "Welche Daten der Bericht abdeckt. Tickets werden über eine Ticket-Abfrage aufgelöst, Aufwände über eine Aufwands-Abfrage. Eine Vorlage berichtet über eines von beiden."
  text_reporter_template_margins_info: "Oben, rechts, unten und links in Millimetern, durch Kommas getrennt — zum Beispiel 20,15,20,15. Leer lassen für den Standardwert."
  text_reporter_template_content_executes: "Eine Berichtsvorlage wird auf dem Server ausgeführt. Wer eine bearbeiten darf, kann Code mit den Rechten der Anwendung ausführen."
  text_reporter_template_visibility_private_only: "Nur wer \"Öffentliche Berichtsvorlagen verwalten\" besitzt, kann eine Vorlage weiter freigeben; diese bleibt daher nur für Sie sichtbar."
  text_reporter_template_import_info: "Eine aus diesem Plugin exportierte JSON-Datei oder eine aus dem Reporter-Plugin exportierte YAML-Vorlage. Die importierte Vorlage ist zunächst immer nur für Sie sichtbar."
  text_reporter_template_failure_document_info: "Kann ein Bericht nicht erzeugt werden, wird anstelle des Berichts ein PDF mit dem Titel \"Bericht konnte nicht erzeugt werden\" angeboten. Es enthält die Korrelations-ID und niemals den zugrunde liegenden Fehler. Standardmäßig aus."
  text_reporter_template_per_record_html: "Diese Vorlage erzeugt ein Dokument pro Ticket, daher zeigt die Seite unten alle %{count} nacheinander. Für einen PDF-Download wäre ein Archiv nötig, das diese Version noch nicht erstellen kann."
  text_reporter_template_per_record_html_time_entries: "Diese Vorlage erzeugt ein Dokument pro Aufwandsbuchung, daher zeigt die Seite unten alle %{count} hintereinander. Ein PDF-Download benötigt ein Archiv, das diese Version noch nicht erstellen kann."
  text_reporter_preview_bounded: "Vorschau von %{shown} von %{total} Tickets"
  text_reporter_preview_pdf_ok: "Gerendert von %{engine} in %{duration} ms."
  text_reporter_preview_no_html: "Diese Vorlage hat überhaupt keine Ausgabe erzeugt."
  text_reporter_template_no_issues: "Dieser Bericht umfasst keine Tickets und hat daher kein Dokument erzeugt. Erweitern Sie die Ticketauswahl oder wählen Sie eine andere gespeicherte Abfrage."
  text_reporter_template_no_time_entries: "Dieser Bericht umfasst keinen Aufwand und hat daher kein Dokument erzeugt. Erweitern Sie die Auswahl oder wählen Sie eine andere gespeicherte Abfrage."
  text_reporter_time_entries_own_only: "Ihre Rolle erlaubt es Ihnen, in diesem Projekt nur Ihren eigenen Aufwand zu sehen. Dieser Bericht umfasst daher Ihre Stunden und nicht die des Projekts."
  text_reporter_time_entries_not_visible: "Ihre Rolle erlaubt es Ihnen nicht, in diesem Projekt Aufwände zu sehen; dieser Bericht ist daher leer."
  text_reporter_failure_document_notice: "Dieses Dokument ist nicht der Bericht. Es hält fest, dass der Bericht nicht erzeugt werden konnte. Geben Sie die oben stehende Korrelations-ID an, wenn Sie eine Administratorin oder einen Administrator bitten, ins Protokoll zu sehen."
  text_reporter_failure_document_value_unavailable: "Dieser Wert konnte in diesem Dokument nicht dargestellt werden."
