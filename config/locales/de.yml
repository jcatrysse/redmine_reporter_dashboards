  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Render-Preflight"
  text_reporter_preflight_intro: "Rendert ein Testdokument durch jede installierte Render-Engine und meldet, was tatsächlich im PDF angekommen ist: Seitenumbrüche, die Seitenzahl-Fußzeile, Hintergrundfarben, ein eingebettetes Bild und der JavaScript-Pfad. Genau diese Fragen kann eine vorhandene, scheinbar gesunde Engine trotzdem falsch beantworten."
  text_reporter_preflight_takes_a_moment: "Dabei wird eine echte Engine gestartet und ein echtes Dokument erzeugt; pro Engine dauert das einige Sekunden."
  button_reporter_preflight_run: "Preflight ausführen"
  text_reporter_preflight_no_engine: "Es ist keine Render-Engine registriert, es wurde also nichts geprüft. In diesem Zustand kann kein Bericht erstellt werden."
  text_reporter_preflight_ok: "Alle Prüfungen bestanden."
  text_reporter_preflight_problems: "%{count} Prüfung(en) fehlgeschlagen."
  text_reporter_preflight_incomplete: "Nichts ist fehlgeschlagen, aber %{count} Prüfung(en) konnten nicht ausgeführt werden. Details siehe unten."
  label_reporter_preflight_engine_version: "Engine-Version"
  label_reporter_preflight_duration: "Dauer"
  label_reporter_preflight_state: "Status"
  label_reporter_preflight_check: "Prüfung"
  label_reporter_preflight_detail: "Details"
  label_reporter_preflight_state_pass: "Bestanden"
  label_reporter_preflight_state_fail: "Fehlgeschlagen"
  label_reporter_preflight_state_skip: "Nicht ausführbar"
  label_reporter_preflight_state_expected_failure: "Erwarteter Fehler"
  label_reporter_preflight_duration_ms: "%{count} ms"
  label_reporter_preflight_json: "Der Bericht als JSON"
  text_reporter_preflight_json: "Kopieren Sie dies in eine Fehlermeldung — es zeigt genau, was ausgeführt wurde und was zurückkam."
  label_reporter_preflight_check_engine: "Die Render-Engine hat ein Dokument erzeugt"
  label_reporter_preflight_check_degradations: "Nichts wurde stillschweigend eingeschränkt"
  label_reporter_preflight_check_page_breaks: "Seitenumbrüche erzeugen mehr als eine Seite"
  label_reporter_preflight_check_footer: "Die Seitenzahl-Fußzeile wird erzeugt und nummeriert"
  label_reporter_preflight_check_background: "Hintergründe werden gedruckt, damit Badges ihre Farbe behalten"
  label_reporter_preflight_check_inline_asset: "Ein eingebettetes Bild wird in der richtigen Farbe dekodiert"
  label_reporter_preflight_check_javascript: "Der JavaScript-Pfad läuft, damit Diagramme gezeichnet werden können"
  label_reporter_preflight_check_readiness: "Die Readiness-Shell wird geladen, damit eine Seite ohne Diagramme nicht wartet"
  label_reporter_preflight_check_hosted_asset: "Ein von Redmine gehostetes Bild wird blockiert (erwartet: der Renderer hat keinen Netzwerkzugriff)"
  label_reporter_asset_policy: "Asset-Richtlinie"
  label_reporter_asset_policy_bundled: "Geb\u00FCndelt \u2014 es wird nichts \u00FCber das Netzwerk geladen (Standard)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 nur von dieser Installation laden"
  label_reporter_asset_policy_external: "Extern \u2014 nur von Hosts auf der Positivliste laden"
  text_reporter_asset_policy_info: "Wie die Bilder, Stylesheets, Schriften und Skripte bezogen werden, auf die ein Bericht verweist. \u201EGeb\u00FCndelt\u201C liest sie von der Festplatte und bettet sie ein, sodass die Render-Engine das Netzwerk nie ber\u00FChrt. Die beiden anderen Werte gelten f\u00FCr diese Installation und niemals f\u00FCr eine einzelne Vorlage: Die Autorin oder der Autor eines Berichts kann sie nicht durch Bearbeiten eines Dokuments erweitern."
  label_reporter_asset_allowlist: "Positivliste f\u00FCr Asset-Hosts"
  text_reporter_asset_allowlist_info: "Ein Hostname pro Zeile. Nur Hostnamen \u2014 kein Schema, kein Port, kein Pfad und keine Platzhalter. Bleibt dieses Feld leer, verh\u00E4lt sich jede Richtlinie genau wie \u201EGeb\u00FCndelt\u201C, damit eine halbfertige Konfiguration den Netzwerkzugriff nicht versehentlich \u00F6ffnet."
  label_reporter_asset_inline_max_bytes: "Assets einbetten bis (Bytes)"
  text_reporter_asset_inline_max_bytes_info: "Oberhalb dieser Gr\u00F6\u00DFe wird ein Asset neben dem Dokument \u00FCbertragen, statt darin eingebettet zu werden \u2014 sofern die Engine das unterst\u00FCtzt. Dies ist eine Kosteneinstellung, keine Begrenzung."
  label_reporter_asset_max_bytes: "Assets ablehnen \u00FCber (Bytes)"
  text_reporter_asset_max_bytes_info: "Eine harte Grenze. Ein gr\u00F6\u00DFeres Asset wird abgelehnt und im Bericht benannt, anstatt den Bericht mit einer L\u00FCcke zu erzeugen."
  text_reporter_asset_policy_collapsed: "Die Positivliste f\u00FCr Asset-Hosts ist leer, daher verh\u00E4lt sich %{mode} derzeit genau wie \u201EGeb\u00FCndelt\u201C und es wird nichts \u00FCber das Netzwerk geladen. F\u00FCgen Sie mindestens einen Hostnamen hinzu, damit die Einstellung wirksam wird."
  text_reporter_asset_settings_dropped: "Einige gespeicherte Werte konnten nicht verwendet werden; stattdessen gelten die Standardwerte:"

