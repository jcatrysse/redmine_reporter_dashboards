  label_reporter_asset_policy: "Asset-Richtlinie"
  label_reporter_asset_policy_bundled: "Geb\u00FCndelt \u2014 es wird nichts \u00FCber das Netzwerk geladen (Standard)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 nur von dieser Installation laden"
  label_reporter_asset_policy_external: "Extern \u2014 nur von Hosts auf der Positivliste laden"
  text_reporter_asset_policy_info: "Wie die Bilder, Stylesheets, Schriften und Skripte bezogen werden, auf die ein Bericht verweist. \u201EGeb\u00FCndelt\u201C liest sie von der Festplatte und bettet sie ein, sodass die Render-Engine das Netzwerk nie ber\u00FChrt. Die beiden anderen Werte gelten f\u00FCr diese Installation und niemals f\u00FCr eine einzelne Vorlage: Die Autorin oder der Autor eines Berichts kann sie nicht durch Bearbeiten eines Dokuments erweitern. Eine Referenz, die diese Richtlinie nicht beschaffen kann, lässt den gesamten Bericht fehlschlagen und benennt die URL; ein Bericht wird nie mit einem fehlenden Bild erzeugt."
  label_reporter_asset_allowlist: "Positivliste f\u00FCr Asset-Hosts"
  text_reporter_asset_allowlist_info: "Ein Hostname pro Zeile. Nur Hostnamen \u2014 kein Schema, kein Port, kein Pfad und keine Platzhalter. Bleibt dieses Feld leer, verh\u00E4lt sich jede Richtlinie genau wie \u201EGeb\u00FCndelt\u201C, damit eine halbfertige Konfiguration den Netzwerkzugriff nicht versehentlich \u00F6ffnet."
  label_reporter_asset_inline_max_bytes: "Assets einbetten bis (Bytes)"
  text_reporter_asset_inline_max_bytes_info: "Oberhalb dieser Gr\u00F6\u00DFe wird ein Asset neben dem Dokument \u00FCbertragen, statt darin eingebettet zu werden \u2014 sofern die Engine das unterst\u00FCtzt. Dies ist eine Kosteneinstellung, keine Begrenzung."
  label_reporter_asset_max_bytes: "Assets ablehnen \u00FCber (Bytes)"
  text_reporter_asset_max_bytes_info: "Eine harte Grenze. Ein größeres Asset wird abgelehnt: der Bericht wird nicht erzeugt, und die Fehlermeldung benennt das Asset."
  text_reporter_asset_policy_collapsed: "Die Positivliste f\u00FCr Asset-Hosts ist leer, daher verh\u00E4lt sich %{mode} derzeit genau wie \u201EGeb\u00FCndelt\u201C und es wird nichts \u00FCber das Netzwerk geladen. F\u00FCgen Sie mindestens einen Hostnamen hinzu, damit die Einstellung wirksam wird."
