  label_reporter_preflight: "Render-Preflight"
  text_reporter_preflight_intro: "Rendert ein Testdokument durch jede installierte Render-Engine und meldet, was tatsächlich im PDF angekommen ist: Seitenumbrüche, die Seitenzahl-Fußzeile, Hintergrundfarben, ein eingebettetes Bild und der JavaScript-Pfad. Genau diese Fragen kann eine vorhandene, scheinbar gesunde Engine trotzdem falsch beantworten."
