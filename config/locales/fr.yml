# T-23 - report templates: the CRUD surface, the preview, and the six permissions T-40
# left PLANNED. `permission_*` and `project_module_*` are read by
# `spec/permissions/permission_map_spec.rb`, which fails if any of the twelve locales is
# missing one - an absent key falls back to English silently, which reads as a bug to a
# reader in another language and hides the gap from review (CLAUDE.md SS10).
#
# The three visibility LABELS are deliberately not here: they are Redmine's own
# `label_visibility_private` / `_roles` / `_public`, already translated in every locale
# core ships, so an administrator meets one concept rather than two (finding S-4).
