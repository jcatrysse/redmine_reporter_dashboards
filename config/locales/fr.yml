# T-31 - the aggregation degradations, as sentences rather than as raw symbols.
#
# `_degradations.html.erb` used to print `Degradation#to_s`: a code and an English sentence
# built in `lib/`. These eight keys are the codes T-31 introduced or inherited on that path;
# the remaining degradation codes still print raw and that gap is §Findings S-17, with the
# mechanism (a key per code, `data` as interpolation, `to_s` as the fallback) settled here.
#
# THE PLACEHOLDERS ARE THE DEGRADATION'S OWN `data` KEYS and are identical in all twelve files.
# A key whose placeholder does not match its emit site raises
# `I18n::MissingInterpolationArgument`, which `reporter_degradation_text` catches into the raw
# fallback - so a mistake here loses the translation, never the message.

  text_reporter_degradation_aggregation_group_by_required: "Un rapport sur le temps passé ne peut pas être résumé sans dimension. Ajoutez group_by: à la balise d'agrégation — par exemple group_by: activity."
  text_reporter_degradation_aggregation_dimension_unknown: "%{group_by} n'est pas un critère de regroupement possible pour un rapport sur le temps passé."
  text_reporter_degradation_aggregation_measure_unknown: "%{measure} n'est pas une mesure possible pour un rapport sur le temps passé."
  text_reporter_degradation_aggregation_dimension_unavailable: "Regrouper par %{group_by} exige que chaque saisie soit liée à sa demande, ce que seule une requête de temps passé enregistrée fournit. Choisissez-en une pour ce rapport."
  text_reporter_degradation_aggregation_sort_unsupported: "Le tri par %{sort} n'est pas disponible pour le temps passé : les groupes sont donc ordonnés par taille."
  text_reporter_degradation_aggregation_axis_truncated: "%{group_by} a trop de valeurs pour être affiché : %{kept} sont listées et %{folded} ont été regroupées."
  text_reporter_degradation_aggregation_params_unsupported: "%{params} ne peut pas être utilisé dans un rapport sur le temps passé. Le reste de l'agrégation a été calculé."
  text_reporter_degradation_aggregation_query_id_unresolved: "Aucune requête enregistrée n'a été trouvée pour query_id: %{query_id} : rien n'a donc été compté. Rappelez-vous qu'une valeur entre guillemets est du texte littéral — écrivez-la sans guillemets pour lire une variable."
  text_reporter_degradation_aggregation_source_unsupported: "La source de données de ce rapport (%{source}) ne peut pas être résumée par %{tag}."
  text_reporter_degradation_legacy_engine: "Dessiné par wkhtmltopdf, un moteur de compatibilité dont le retrait est prévu ; le CSS moderne n'est pas pris en charge."
  text_reporter_degradation_asset_structural_fallback: "Un fichier a été intégré sous une forme alternative, car l'intégrer directement aurait changé le sens du document."
  text_reporter_degradation_asset_srcset_collapsed: "Seule la première de plusieurs tailles d'image a été utilisée : une page imprimée a une résolution unique."
  text_reporter_degradation_asset_nested_depth: "Une feuille de style en importait d'autres plus profondément qu'autorisé ; l'import le plus profond n'a pas été intégré."
  text_reporter_degradation_asset_inline_oversize: "Un fichier au-delà du seuil d'intégration a tout de même été intégré, car ce moteur de rendu ne peut pas transporter de fichiers à côté du document."
  text_reporter_degradation_asset_document_cap: "Ce rapport fait référence à plus de fichiers qu'il n'est possible d'en intégrer dans un seul document ; le reste a été laissé de côté."

