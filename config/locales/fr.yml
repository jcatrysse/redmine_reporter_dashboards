  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Contrôle de rendu"
  text_reporter_preflight_intro: "Effectue le rendu d'un document témoin dans chaque moteur de rendu installé et rapporte ce qui est réellement arrivé dans le PDF : sauts de page, pied de page numéroté, couleurs de fond, image intégrée et chemin JavaScript. Ce sont précisément les questions auxquelles un moteur présent et apparemment sain peut malgré tout répondre de travers."
  text_reporter_preflight_takes_a_moment: "Un véritable moteur est démarré et un véritable document est attendu : comptez quelques secondes par moteur."
  button_reporter_preflight_run: "Lancer le contrôle"
  label_reporter_preflight_engine: "Moteur"
  label_reporter_preflight_engine_default: "Tous les moteurs qui ne nécessitent aucun service (par défaut)"
  text_reporter_preflight_unknown_engine: "Aucun moteur de rendu n'est enregistré sous ce nom. Moteurs connus : %{engines}."
  text_reporter_preflight_no_engine: "Aucun moteur de rendu n'est enregistré, rien n'a donc été vérifié. Dans cet état, aucun rapport ne peut être produit."
  text_reporter_preflight_ok: "Tous les contrôles ont réussi."
  text_reporter_preflight_problems: "%{count} contrôle(s) en échec."
  text_reporter_preflight_incomplete: "Rien n'a échoué, mais %{count} contrôle(s) n'ont pas pu être exécutés. Voir les détails ci-dessous."
  label_reporter_preflight_engine_version: "Version du moteur"
  label_reporter_preflight_duration: "Durée"
  label_reporter_preflight_state: "État"
  label_reporter_preflight_check: "Contrôle"
  label_reporter_preflight_detail: "Détails"
  label_reporter_preflight_state_pass: "Réussi"
  label_reporter_preflight_state_fail: "Échoué"
  label_reporter_preflight_state_skip: "N'a pas pu être exécuté"
  label_reporter_preflight_state_expected_failure: "Échec attendu"
  label_reporter_preflight_duration_ms: "%{count} ms"
  label_reporter_preflight_json: "Le rapport au format JSON"
  text_reporter_preflight_json: "Copiez ceci dans un rapport de bogue — il dit exactement ce qui a été exécuté et ce qui est revenu."
  label_reporter_preflight_check_gotenberg_endpoint: "Une adresse est configurée pour le service de rendu"
  label_reporter_preflight_check_gotenberg_reachable: "Le service de rendu répond, et c'est bien un Gotenberg"
  label_reporter_preflight_check_gotenberg_credential: "Le service de rendu impose son identifiant"
  label_reporter_preflight_check_gotenberg_version: "Le service de rendu est un Gotenberg 8 ou ultérieur"
  label_reporter_preflight_check_gotenberg_javascript: "JavaScript est activé sur le service de rendu, les graphiques peuvent donc se dessiner"
  label_reporter_preflight_check_engine_not_selected: "Le moteur de rendu nécessite un service et n'est pas le moteur retenu pour cette installation"
  label_reporter_preflight_check_engine_configuration: "Le moteur a pu être interrogé sur sa configuration"
  label_reporter_preflight_check_engine: "Le moteur de rendu a produit un document"
  label_reporter_preflight_check_degradations: "Rien n'a été dégradé silencieusement"
  label_reporter_preflight_check_page_breaks: "Les sauts de page produisent plus d'une page"
  label_reporter_preflight_check_footer: "Le pied de page numéroté est compilé et numéroté"
  label_reporter_preflight_check_background: "Les fonds sont imprimés, les badges gardent donc leur couleur"
  label_reporter_preflight_check_inline_asset: "Une image intégrée se décode dans la bonne couleur"
  label_reporter_preflight_check_javascript: "Le chemin JavaScript fonctionne, les graphiques peuvent donc se dessiner"
  label_reporter_preflight_check_readiness: "Le shell de disponibilité se charge, une page sans graphique n'attend donc pas"
  label_reporter_preflight_check_hosted_asset: "Une image hébergée par Redmine est bloquée (attendu : le moteur de rendu n'a pas d'accès réseau)"
  label_reporter_authoring_audit: "Rédaction des modèles — qui peut exécuter du code côté serveur"
  text_reporter_authoring_audit_intro: "Un modèle de rapport est exécuté sur le serveur : le droit d'en écrire un est donc le droit d'exécuter du code. Chaque rôle pouvant créer ou modifier le corps d'un modèle est listé ici — ceux de ce plugin comme ceux du plugin de reporting de base. Les permissions qui ne font qu'élargir la visibilité d'un modèle ne sont pas listées : seules, elles ne permettent pas d'en écrire un. Une attribution survit au plugin qui l'a enregistrée : un rôle peut donc encore apparaître ici après la suppression de ce plugin."
  text_reporter_authoring_audit_none: "Aucun rôle ne peut créer ou modifier un modèle de rapport. Sur cette installation, seuls les administrateurs peuvent en rédiger."
  label_reporter_authoring_audit_role: "Rôle"
  label_reporter_authoring_audit_base: "Plugin de reporting de base"
  label_reporter_authoring_audit_own: "Ce plugin"
  label_reporter_authoring_audit_verdict: "Ce que cela signifie"
  text_reporter_authoring_audit_both: "Rédige dans les deux plugins. Rien à décider."
  text_reporter_authoring_audit_only_base: "Rédige uniquement dans le plugin de base. Ces utilisateurs écrivent des modèles aujourd'hui et ne pourront pas le faire ici — accordez-leur une permission de ce côté, ou décidez qu'ils ne doivent plus en rédiger."
  text_reporter_authoring_audit_only_own: "Rédige uniquement dans ce plugin. Vérifiez que c'était voulu : Redmine accorde au rôle Manager toutes les permissions disponibles lorsqu'il charge sa configuration par défaut, cela peut donc apparaître sans que personne ne l'ait choisi."
  text_reporter_authoring_audit_builtin: "(rôle intégré — s'applique aux utilisateurs qui ne sont pas membres du projet)"
  label_reporter_asset_policy: "Politique des ressources"
  label_reporter_asset_policy_bundled: "Embarquées — rien n'est récupéré sur le réseau (par défaut)"
  label_reporter_asset_policy_redmine: "Redmine — récupérer depuis cette installation uniquement"
  label_reporter_asset_policy_external: "Externes — récupérer uniquement depuis les hôtes autorisés"
  text_reporter_asset_policy_info: "Comment sont obtenues les images, feuilles de style, polices et scripts auxquels un rapport fait référence. Embarquées les lit sur le disque et les intègre, si bien que le moteur de rendu ne touche jamais au réseau. Les deux autres sont des réglages de cette installation et jamais d'un modèle : l'auteur d'un rapport ne peut pas les élargir en modifiant un document. Une référence que cette politique ne peut pas obtenir fait échouer tout le rapport en nommant l'URL ; un rapport n'est jamais produit avec une image manquante."
  label_reporter_asset_allowlist: "Hôtes de ressources autorisés"
  text_reporter_asset_allowlist_info: "Un nom d'hôte par ligne. Noms d'hôte uniquement — sans schéma, sans port, sans chemin et sans joker. Laisser vide fait que chaque politique se comporte exactement comme Embarquées, de sorte qu'une configuration inachevée ne puisse pas ouvrir un accès réseau par accident."
  label_reporter_asset_inline_max_bytes: "Intégrer les ressources jusqu'à (octets)"
  text_reporter_asset_inline_max_bytes_info: "Au-delà de cette taille, une ressource accompagne le document au lieu d'y être intégrée, sur les moteurs qui le permettent. C'est un réglage de coût, pas une limite."
  label_reporter_asset_max_bytes: "Refuser les ressources au-delà de (octets)"
  text_reporter_asset_max_bytes_info: "Une limite stricte. Une ressource plus grande est refusée : le rapport n'est pas produit, et l'échec nomme la ressource."
  text_reporter_asset_policy_collapsed: "La liste des hôtes de ressources autorisés est vide : %{mode} se comporte donc actuellement exactement comme Embarquées et rien n'est récupéré sur le réseau. Ajoutez au moins un nom d'hôte pour que cela prenne effet."
  text_reporter_asset_settings_dropped: "Certaines valeurs enregistrées n'ont pas pu être utilisées ; les valeurs par défaut s'appliquent à la place :"

