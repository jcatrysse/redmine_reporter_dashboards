# T-31 - the aggregation degradations, as sentences rather than as raw symbols.
#
# `_degradations.html.erb` used to print `Degradation#to_s`: a code and an English sentence
# built in `lib/`. These eight keys are the codes T-31 introduced or inherited on that path;
# the remaining degradation codes still print raw and that gap is §Findings S-17, with the
# mechanism (a key per code, `data` as interpolation, `to_s` as the fallback) settled here.
#
# THE PLACEHOLDERS ARE THE DEGRADATION'S OWN `data` KEYS and are identical in all twelve files.
# A key whose placeholder does not match its emit site raises
# `I18n::MissingInterpolationArgument`, which `reporter_degradation_text` catches into the raw
# fallback - so a mistake here loses the translation, never the message.

  text_reporter_degradation_aggregation_group_by_required: "Um relatório de tempo gasto não pode ser resumido sem uma dimensão. Acrescente group_by: à etiqueta de agregação — por exemplo group_by: activity."
  text_reporter_degradation_aggregation_dimension_unknown: "%{group_by} não é algo por que um relatório de tempo gasto possa ser agrupado."
  text_reporter_degradation_aggregation_measure_unknown: "%{measure} não é algo que um relatório de tempo gasto possa medir."
  text_reporter_degradation_aggregation_dimension_unavailable: "Agrupar por %{group_by} exige que cada registo esteja ligado à sua tarefa, o que só uma consulta guardada de tempo gasto fornece. Escolha uma para este relatório."
  text_reporter_degradation_aggregation_sort_unsupported: "Ordenar por %{sort} não está disponível para tempo gasto, pelo que os grupos ficam ordenados por tamanho."
  text_reporter_degradation_aggregation_axis_truncated: "%{group_by} tem demasiados valores para mostrar: %{kept} estão listados e %{folded} foram agrupados."
  text_reporter_degradation_aggregation_params_unsupported: "%{params} não pode ser usado num relatório de tempo gasto. O resto da agregação foi calculado."
  text_reporter_degradation_aggregation_query_id_unresolved: "Não foi encontrada nenhuma consulta guardada para query_id: %{query_id}, pelo que nada foi contado. Recorde que um valor entre aspas é texto literal — escreva-o sem aspas para ler uma variável."
  text_reporter_degradation_aggregation_source_unsupported: "A fonte de dados deste relatório (%{source}) não pode ser resumida por %{tag}."
  text_reporter_degradation_legacy_engine: "Desenhado pelo wkhtmltopdf, um motor de compatibilidade cuja remoção está prevista; CSS moderno não é suportado."
  text_reporter_degradation_asset_structural_fallback: "Um ficheiro foi embutido numa forma alternativa, porque embuti-lo diretamente teria alterado o significado do documento."
  text_reporter_degradation_asset_srcset_collapsed: "Foi usado apenas o primeiro de vários tamanhos de imagem: uma página impressa tem uma única resolução."
  text_reporter_degradation_asset_nested_depth: "Uma folha de estilo importou outras mais profundamente do que é permitido; a importação mais profunda não foi embutida."
  text_reporter_degradation_asset_inline_oversize: "Um ficheiro acima do limiar de incorporação foi ainda assim embutido, porque este motor de rendição não consegue transportar ficheiros ao lado do documento."
  text_reporter_degradation_asset_document_cap: "Este relatório refere-se a mais ficheiros do que é possível embutir num só documento; os restantes ficaram de fora."

