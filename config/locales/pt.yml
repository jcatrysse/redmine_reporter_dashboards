  label_reporter_preflight_state_fail: "Falhou"
  label_reporter_preflight_state_skip: "Não pôde ser executada"
  label_reporter_preflight_state_expected_failure: "Falha esperada"
  label_reporter_preflight_duration_ms: "%{count} ms"
  label_reporter_preflight_json: "O relatório em JSON"
  text_reporter_preflight_json: "Copie isto para um relatório de erro — diz exatamente o que foi executado e o que voltou."
  label_reporter_preflight_check_gotenberg_endpoint: "Está configurado um endereço para o serviço de rendição"
  label_reporter_preflight_check_gotenberg_reachable: "O serviço de rendição responde, e é um Gotenberg"
  label_reporter_preflight_check_gotenberg_credential: "O serviço de rendição impõe a sua credencial"
  label_reporter_preflight_check_gotenberg_version: "O serviço de rendição é Gotenberg 8 ou posterior"
  label_reporter_preflight_check_gotenberg_javascript: "O serviço de rendição tem JavaScript ativado, para que os gráficos possam desenhar"
  label_reporter_preflight_check_engine_not_selected: "O motor de rendição precisa de um serviço e não é o motor selecionado nesta instalação"
  label_reporter_preflight_check_engine_configuration: "Foi possível perguntar ao motor pela sua configuração"
  label_reporter_preflight_check_engine: "O motor de rendição produziu um documento"
  label_reporter_preflight_check_degradations: "Nada foi degradado silenciosamente"
  label_reporter_preflight_check_page_breaks: "As quebras de página produzem mais do que uma página"
  label_reporter_preflight_check_footer: "O rodapé com o número de página é compilado e numerado"
  label_reporter_preflight_check_background: "Os fundos são impressos, pelo que os crachás mantêm a cor"
  label_reporter_preflight_check_inline_asset: "Uma imagem incorporada descodifica na cor certa"
  label_reporter_preflight_check_javascript: "O caminho do JavaScript funciona, para que os gráficos possam desenhar"
  label_reporter_preflight_check_readiness: "A camada de prontidão carrega, pelo que uma página sem gráficos não espera"
  label_reporter_preflight_check_hosted_asset: "Uma imagem alojada pelo Redmine é bloqueada (esperado: o motor de rendição não tem acesso à rede)"
  label_reporter_authoring_audit: "Escrita de modelos — quem pode executar código no servidor"
  text_reporter_authoring_audit_intro: "Um modelo de relatório é executado no servidor, pelo que a permissão para escrever um é a permissão para executar código. Todos os perfis que podem criar ou editar o corpo de um modelo estão listados aqui — os deste plugin e os do plugin de relatórios de base. As permissões que apenas alargam a visibilidade de um modelo não estão listadas: por si só não permitem escrever um. Uma atribuição sobrevive ao plugin que a registou, pelo que um perfil pode ainda aparecer aqui depois de esse plugin ter sido removido."
  text_reporter_authoring_audit_none: "Nenhum perfil pode criar ou editar um modelo de relatório. Nesta instalação, só os administradores podem escrever modelos de relatório."
  label_reporter_authoring_audit_role: "Perfil"
  label_reporter_authoring_audit_base: "Plugin de relatórios de base"
  label_reporter_authoring_audit_own: "Este plugin"
  label_reporter_authoring_audit_verdict: "O que isto significa"
  text_reporter_authoring_audit_both: "Escreve em ambos os plugins. Não há nada a decidir."
  text_reporter_authoring_audit_only_base: "Escreve apenas no plugin de base. Estes utilizadores escrevem modelos hoje e não o poderão fazer aqui — conceda-lhes uma permissão deste lado, ou decida que já não devem escrever modelos."
  text_reporter_authoring_audit_only_own: "Escreve apenas neste plugin. Confirme que isto foi intencional: o Redmine concede ao perfil Gestor todas as permissões disponíveis quando carrega a configuração predefinida, pelo que isto pode surgir sem que ninguém o tenha escolhido."
  text_reporter_authoring_audit_builtin: "(perfil incorporado — aplica-se a utilizadores que não são membros do projeto)"
  label_reporter_asset_policy: "Política de recursos"
  label_reporter_asset_policy_bundled: "Incorporados — nada é obtido através da rede (predefinição)"
  label_reporter_asset_policy_redmine: "Redmine — obter apenas desta instalação"
  label_reporter_asset_policy_external: "Externos — obter apenas de anfitriões na lista de permissões"
  text_reporter_asset_policy_info: "Como são obtidas as imagens, folhas de estilo, tipos de letra e scripts a que um relatório faz referência. Incorporados lê-os do disco e embute-os, pelo que o motor de rendição nunca toca na rede. As outras duas são definições desta instalação e nunca de um modelo: o autor de um relatório não as pode alargar editando um documento. Uma referência que esta política não consiga obter faz falhar todo o relatório e nomeia o URL; nunca é produzido um relatório com uma imagem em falta."
  label_reporter_asset_allowlist: "Lista de anfitriões de recursos permitidos"
  text_reporter_asset_allowlist_info: "Um nome de anfitrião por linha. Apenas nomes de anfitrião — sem esquema, sem porta, sem caminho e sem caracteres universais. Deixar isto vazio faz com que todas as políticas se comportem exatamente como Incorporados, para que uma configuração inacabada não possa abrir acesso à rede por acidente."
  label_reporter_asset_inline_max_bytes: "Embutir recursos até (bytes)"
  text_reporter_asset_inline_max_bytes_info: "Acima deste tamanho, um recurso viaja ao lado do documento em vez de ser embutido nele, nos motores que o suportam. Isto é uma definição de custo, não um limite."
  label_reporter_asset_max_bytes: "Recusar recursos acima de (bytes)"
  text_reporter_asset_max_bytes_info: "Um limite rígido. Um recurso maior do que isto é recusado: o relatório não é produzido, e a falha nomeia o recurso."
  text_reporter_asset_policy_collapsed: "A lista de anfitriões de recursos permitidos está vazia, pelo que %{mode} se comporta atualmente exatamente como Incorporados e nada é obtido através da rede. Adicione pelo menos um nome de anfitrião para que tenha efeito."
  text_reporter_asset_settings_dropped: "Alguns valores guardados não puderam ser usados, e em vez deles vigoram as predefinições:"

