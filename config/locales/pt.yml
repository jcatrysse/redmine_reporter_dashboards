  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Verificação de rendição"
  text_reporter_preflight_intro: "Rende um documento de teste em cada motor de rendição instalado e relata o que chegou realmente ao PDF: quebras de página, o rodapé com o número de página, cores de fundo, uma imagem incorporada e o caminho do JavaScript. São precisamente estas as perguntas a que um motor presente e aparentemente saudável pode ainda assim responder mal."
  text_reporter_preflight_takes_a_moment: "Isto arranca um motor real e espera por um documento real, pelo que demora alguns segundos por motor."
  button_reporter_preflight_run: "Executar verificação"
  label_reporter_preflight_engine: "Motor"
  label_reporter_preflight_engine_default: "Todos os motores que não precisam de serviço (predefinição)"
  text_reporter_preflight_unknown_engine: "Não há nenhum motor de rendição registado com esse nome. Motores conhecidos: %{engines}."
  text_reporter_preflight_no_engine: "Não há nenhum motor de rendição registado, pelo que nada foi verificado. Neste estado não é possível produzir nenhum relatório."
  text_reporter_preflight_ok: "Todas as verificações passaram."
  text_reporter_preflight_problems: "%{count} verificação(ões) falharam."
  text_reporter_preflight_incomplete: "Nada falhou, mas %{count} verificação(ões) não puderam ser executadas. Veja os detalhes abaixo."
  label_reporter_preflight_engine_version: "Versão do motor"
