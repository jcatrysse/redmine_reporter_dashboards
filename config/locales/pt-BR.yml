  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Verificação prévia de renderização"
  text_reporter_preflight_intro: "Renderiza um documento de teste em cada mecanismo de renderização instalado e informa o que realmente chegou ao PDF: quebras de página, o rodapé com o número da página, as cores de fundo, uma imagem incorporada e o caminho do JavaScript. São justamente as perguntas que um mecanismo presente e aparentemente saudável ainda pode responder de forma errada."
  text_reporter_preflight_takes_a_moment: "Isso inicia um mecanismo real e aguarda um documento real, portanto leva alguns segundos por mecanismo."
  button_reporter_preflight_run: "Executar verificação"
  text_reporter_preflight_no_engine: "Nenhum mecanismo de renderização está registrado, portanto nada foi verificado. Nesse estado nenhum relatório pode ser produzido."
  text_reporter_preflight_ok: "Todas as verificações passaram."
  text_reporter_preflight_problems: "%{count} verificação(ões) falhou(aram)."
  text_reporter_preflight_incomplete: "Nada falhou, mas %{count} verificação(ões) não pôde(puderam) ser executada(s). Veja os detalhes abaixo."
  label_reporter_preflight_engine_version: "Versão do mecanismo"
  label_reporter_preflight_duration: "Duração"
  label_reporter_preflight_state: "Estado"
  label_reporter_preflight_check: "Verificação"
  label_reporter_preflight_detail: "Detalhes"
  label_reporter_preflight_state_pass: "Aprovada"
  label_reporter_preflight_state_fail: "Falhou"
  label_reporter_preflight_state_skip: "Não pôde ser executada"
  label_reporter_preflight_state_expected_failure: "Falha esperada"
  label_reporter_preflight_duration_ms: "%{count} ms"
  label_reporter_preflight_json: "O relatório em JSON"
  text_reporter_preflight_json: "Copie isto em um relatório de erro: ele diz exatamente o que foi executado e o que retornou."
  label_reporter_preflight_check_engine: "O mecanismo de renderização produziu um documento"
  label_reporter_preflight_check_degradations: "Nada foi degradado silenciosamente"
  label_reporter_preflight_check_page_breaks: "As quebras de página produzem mais de uma página"
  label_reporter_preflight_check_footer: "O rodapé com o número da página é gerado e numerado"
  label_reporter_preflight_check_background: "Os fundos são impressos, para que os selos mantenham sua cor"
  label_reporter_preflight_check_inline_asset: "Uma imagem incorporada é decodificada com a cor correta"
  label_reporter_preflight_check_javascript: "O caminho do JavaScript é executado, para que os gráficos possam ser desenhados"
  label_reporter_preflight_check_readiness: "O script de prontidão é carregado, de modo que uma página sem gráficos não espera"
  label_reporter_preflight_check_hosted_asset: "Uma imagem hospedada no Redmine é bloqueada (esperado: o renderizador não tem acesso à rede)"
  label_reporter_asset_policy: "Pol\u00EDtica de recursos"
  label_reporter_asset_policy_bundled: "Empacotados \u2014 nada \u00E9 baixado pela rede (padr\u00E3o)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 baixar somente desta instala\u00E7\u00E3o"
  label_reporter_asset_policy_external: "Externo \u2014 baixar somente de hosts na lista de permiss\u00F5es"
  text_reporter_asset_policy_info: "Como as imagens, folhas de estilo, fontes e scripts referenciados por um relat\u00F3rio s\u00E3o obtidos. \u00ABEmpacotados\u00BB l\u00EA os arquivos do disco e os incorpora, de modo que o mecanismo de renderiza\u00E7\u00E3o nunca toca a rede. As outras duas op\u00E7\u00F5es s\u00E3o configura\u00E7\u00F5es desta instala\u00E7\u00E3o e nunca de um modelo: quem escreve um relat\u00F3rio n\u00E3o pode ampli\u00E1-las editando um documento."
  label_reporter_asset_allowlist: "Lista de hosts permitidos para recursos"
  text_reporter_asset_allowlist_info: "Um nome de host por linha. Somente nomes de host \u2014 sem esquema, sem porta, sem caminho e sem curingas. Deixar em branco faz qualquer pol\u00EDtica se comportar exatamente como \u00ABEmpacotados\u00BB, para que uma configura\u00E7\u00E3o incompleta n\u00E3o abra o acesso \u00E0 rede por acidente."
  label_reporter_asset_inline_max_bytes: "Incorporar recursos de at\u00E9 (bytes)"
  text_reporter_asset_inline_max_bytes_info: "Acima desse tamanho o recurso viaja junto com o documento em vez de ser incorporado nele, nos mecanismos que aceitam isso. \u00C9 uma configura\u00E7\u00E3o de custo, n\u00E3o um limite."
  label_reporter_asset_max_bytes: "Recusar recursos acima de (bytes)"
  text_reporter_asset_max_bytes_info: "Um limite r\u00EDgido. Um recurso maior \u00E9 recusado e o relat\u00F3rio o nomeia, em vez de ser gerado com uma lacuna."
  text_reporter_asset_policy_collapsed: "A lista de hosts permitidos est\u00E1 vazia, portanto %{mode} atualmente se comporta exatamente como \u00ABEmpacotados\u00BB e nada \u00E9 baixado pela rede. Adicione pelo menos um nome de host para que tenha efeito."
  text_reporter_asset_settings_dropped: "Alguns valores salvos n\u00E3o puderam ser usados; os padr\u00F5es est\u00E3o em vigor:"

