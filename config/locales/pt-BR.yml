  label_reporter_preflight_check_readiness: "O script de prontidão é carregado, de modo que uma página sem gráficos não espera"
  label_reporter_preflight_check_hosted_asset: "Uma imagem hospedada no Redmine é bloqueada (esperado: o renderizador não tem acesso à rede)"
  label_reporter_asset_policy: "Pol\u00EDtica de recursos"
  label_reporter_asset_policy_bundled: "Empacotados \u2014 nada \u00E9 baixado pela rede (padr\u00E3o)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 baixar somente desta instala\u00E7\u00E3o"
  label_reporter_asset_policy_external: "Externo \u2014 baixar somente de hosts na lista de permiss\u00F5es"
  text_reporter_asset_policy_info: "Como as imagens, folhas de estilo, fontes e scripts referenciados por um relat\u00F3rio s\u00E3o obtidos. \u00ABEmpacotados\u00BB l\u00EA os arquivos do disco e os incorpora, de modo que o mecanismo de renderiza\u00E7\u00E3o nunca toca a rede. As outras duas op\u00E7\u00F5es s\u00E3o configura\u00E7\u00F5es desta instala\u00E7\u00E3o e nunca de um modelo: quem escreve um relat\u00F3rio n\u00E3o pode ampli\u00E1-las editando um documento. Uma referência que esta política não consegue obter faz todo o relatório falhar e nomeia a URL; um relatório nunca é produzido com uma imagem faltando."
  label_reporter_asset_allowlist: "Lista de hosts permitidos para recursos"
  text_reporter_asset_allowlist_info: "Um nome de host por linha. Somente nomes de host \u2014 sem esquema, sem porta, sem caminho e sem curingas. Deixar em branco faz qualquer pol\u00EDtica se comportar exatamente como \u00ABEmpacotados\u00BB, para que uma configura\u00E7\u00E3o incompleta n\u00E3o abra o acesso \u00E0 rede por acidente."
  label_reporter_asset_inline_max_bytes: "Incorporar recursos de at\u00E9 (bytes)"
  text_reporter_asset_inline_max_bytes_info: "Acima desse tamanho o recurso viaja junto com o documento em vez de ser incorporado nele, nos mecanismos que aceitam isso. \u00C9 uma configura\u00E7\u00E3o de custo, n\u00E3o um limite."
  label_reporter_asset_max_bytes: "Recusar recursos acima de (bytes)"
  text_reporter_asset_max_bytes_info: "Um limite rígido. Um recurso maior é recusado: o relatório não é produzido e a falha nomeia o recurso."
  text_reporter_asset_policy_collapsed: "A lista de hosts permitidos est\u00E1 vazia, portanto %{mode} atualmente se comporta exatamente como \u00ABEmpacotados\u00BB e nada \u00E9 baixado pela rede. Adicione pelo menos um nome de host para que tenha efeito."
  text_reporter_asset_settings_dropped: "Alguns valores salvos n\u00E3o puderam ser usados; os padr\u00F5es est\u00E3o em vigor:"

