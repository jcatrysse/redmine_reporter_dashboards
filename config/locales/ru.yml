  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Предварительная проверка рендеринга"
  text_reporter_preflight_intro: "Формирует тестовый документ каждым установленным механизмом рендеринга и сообщает, что действительно попало в PDF: разрывы страниц, нижний колонтитул с номером страницы, цвета фона, встроенное изображение и работу JavaScript. Именно на эти вопросы установленный и внешне исправный механизм всё ещё может ответить неверно."
  text_reporter_preflight_takes_a_moment: "При этом запускается настоящий механизм и ожидается настоящий документ, поэтому проверка занимает несколько секунд на каждый механизм."
  button_reporter_preflight_run: "Выполнить проверку"
  text_reporter_preflight_no_engine: "Ни один механизм рендеринга не зарегистрирован, поэтому ничего не проверено. В таком состоянии отчёт создать невозможно."
  text_reporter_preflight_ok: "Все проверки пройдены."
  text_reporter_preflight_problems: "Не пройдено проверок: %{count}."
  text_reporter_preflight_incomplete: "Ошибок нет, но не удалось выполнить проверок: %{count}. Подробности ниже."
