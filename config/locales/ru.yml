  label_reporter_asset_policy: "\u041F\u043E\u043B\u0438\u0442\u0438\u043A\u0430 \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432"
  label_reporter_asset_policy_bundled: "\u0412\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0435 \u2014 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F \u043F\u043E \u0441\u0435\u0442\u0438 (\u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u0441 \u044D\u0442\u043E\u0439 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0438"
  label_reporter_asset_policy_external: "\u0412\u043D\u0435\u0448\u043D\u0438\u0435 \u2014 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u0441 \u0443\u0437\u043B\u043E\u0432 \u0438\u0437 \u0441\u043F\u0438\u0441\u043A\u0430 \u0440\u0430\u0437\u0440\u0435\u0448\u0451\u043D\u043D\u044B\u0445"
  text_reporter_asset_policy_info: "\u041A\u0430\u043A \u043F\u043E\u043B\u0443\u0447\u0430\u044E\u0442\u0441\u044F \u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u044F, \u0442\u0430\u0431\u043B\u0438\u0446\u044B \u0441\u0442\u0438\u043B\u0435\u0439, \u0448\u0440\u0438\u0444\u0442\u044B \u0438 \u0441\u043A\u0440\u0438\u043F\u0442\u044B, \u043D\u0430 \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0441\u0441\u044B\u043B\u0430\u0435\u0442\u0441\u044F \u043E\u0442\u0447\u0451\u0442. \u00AB\u0412\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0435\u00BB \u0447\u0438\u0442\u0430\u0435\u0442 \u0438\u0445 \u0441 \u0434\u0438\u0441\u043A\u0430 \u0438 \u0432\u0441\u0442\u0440\u0430\u0438\u0432\u0430\u0435\u0442 \u0432 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043C\u0435\u0445\u0430\u043D\u0438\u0437\u043C \u043E\u0442\u0440\u0438\u0441\u043E\u0432\u043A\u0438 \u043D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u043E\u0431\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044F \u043A \u0441\u0435\u0442\u0438. \u041E\u0441\u0442\u0430\u043B\u044C\u043D\u044B\u0435 \u0434\u0432\u0430 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u2014 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u044D\u0442\u043E\u0439 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0438, \u0430 \u043D\u0435 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u043E\u0433\u043E \u0448\u0430\u0431\u043B\u043E\u043D\u0430: \u0430\u0432\u0442\u043E\u0440 \u043E\u0442\u0447\u0451\u0442\u0430 \u043D\u0435 \u043C\u043E\u0436\u0435\u0442 \u0440\u0430\u0441\u0448\u0438\u0440\u0438\u0442\u044C \u0438\u0445, \u0438\u0437\u043C\u0435\u043D\u0438\u0432 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442. Ссылка, которую эта политика не может получить, приводит к отказу всего отчёта с указанием URL; отчёт никогда не создаётся с отсутствующим изображением."
  label_reporter_asset_allowlist: "\u0421\u043F\u0438\u0441\u043E\u043A \u0440\u0430\u0437\u0440\u0435\u0448\u0451\u043D\u043D\u044B\u0445 \u0443\u0437\u043B\u043E\u0432 \u0434\u043B\u044F \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432"
  text_reporter_asset_allowlist_info: "\u041F\u043E \u043E\u0434\u043D\u043E\u043C\u0443 \u0438\u043C\u0435\u043D\u0438 \u0443\u0437\u043B\u0430 \u0432 \u0441\u0442\u0440\u043E\u043A\u0435. \u0422\u043E\u043B\u044C\u043A\u043E \u0438\u043C\u0435\u043D\u0430 \u0443\u0437\u043B\u043E\u0432 \u2014 \u0431\u0435\u0437 \u0441\u0445\u0435\u043C\u044B, \u043F\u043E\u0440\u0442\u0430, \u043F\u0443\u0442\u0438 \u0438 \u043F\u043E\u0434\u0441\u0442\u0430\u043D\u043E\u0432\u043E\u0447\u043D\u044B\u0445 \u0437\u043D\u0430\u043A\u043E\u0432. \u0415\u0441\u043B\u0438 \u043F\u043E\u043B\u0435 \u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C \u043F\u0443\u0441\u0442\u044B\u043C, \u043B\u044E\u0431\u0430\u044F \u043F\u043E\u043B\u0438\u0442\u0438\u043A\u0430 \u0431\u0443\u0434\u0435\u0442 \u0432\u0435\u0441\u0442\u0438 \u0441\u0435\u0431\u044F \u0442\u043E\u0447\u043D\u043E \u043A\u0430\u043A \u00AB\u0412\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0435\u00BB, \u0447\u0442\u043E\u0431\u044B \u043D\u0435\u0437\u0430\u0432\u0435\u0440\u0448\u0451\u043D\u043D\u0430\u044F \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u043D\u0435 \u043E\u0442\u043A\u0440\u044B\u043B\u0430 \u0434\u043E\u0441\u0442\u0443\u043F \u043A \u0441\u0435\u0442\u0438 \u0441\u043B\u0443\u0447\u0430\u0439\u043D\u043E."
  label_reporter_asset_inline_max_bytes: "\u0412\u0441\u0442\u0440\u0430\u0438\u0432\u0430\u0442\u044C \u0440\u0435\u0441\u0443\u0440\u0441\u044B \u0440\u0430\u0437\u043C\u0435\u0440\u043E\u043C \u0434\u043E (\u0431\u0430\u0439\u0442)"
  text_reporter_asset_inline_max_bytes_info: "\u0421\u0432\u044B\u0448\u0435 \u044D\u0442\u043E\u0433\u043E \u0440\u0430\u0437\u043C\u0435\u0440\u0430 \u0440\u0435\u0441\u0443\u0440\u0441 \u043F\u0435\u0440\u0435\u0434\u0430\u0451\u0442\u0441\u044F \u0440\u044F\u0434\u043E\u043C \u0441 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u043E\u043C, \u0430 \u043D\u0435 \u0432\u0441\u0442\u0440\u0430\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0432 \u043D\u0435\u0433\u043E, \u2014 \u043D\u0430 \u043C\u0435\u0445\u0430\u043D\u0438\u0437\u043C\u0430\u0445, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u044D\u0442\u043E \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u044E\u0442. \u042D\u0442\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u0438, \u0430 \u043D\u0435 \u043E\u0433\u0440\u0430\u043D\u0438\u0447\u0435\u043D\u0438\u0435."
  label_reporter_asset_max_bytes: "\u041E\u0442\u043A\u043B\u043E\u043D\u044F\u0442\u044C \u0440\u0435\u0441\u0443\u0440\u0441\u044B \u0431\u043E\u043B\u044C\u0448\u0435 (\u0431\u0430\u0439\u0442)"
  text_reporter_asset_max_bytes_info: "Жёсткое ограничение. Ресурс большего размера отклоняется: отчёт не создаётся, а сообщение об ошибке называет ресурс."
  text_reporter_asset_policy_collapsed: "\u0421\u043F\u0438\u0441\u043E\u043A \u0440\u0430\u0437\u0440\u0435\u0448\u0451\u043D\u043D\u044B\u0445 \u0443\u0437\u043B\u043E\u0432 \u043F\u0443\u0441\u0442, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 %{mode} \u0441\u0435\u0439\u0447\u0430\u0441 \u0432\u0435\u0434\u0451\u0442 \u0441\u0435\u0431\u044F \u0442\u043E\u0447\u043D\u043E \u043A\u0430\u043A \u00AB\u0412\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0435\u00BB \u0438 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F \u043F\u043E \u0441\u0435\u0442\u0438. \u0414\u043E\u0431\u0430\u0432\u044C\u0442\u0435 \u0445\u043E\u0442\u044F \u0431\u044B \u043E\u0434\u043D\u043E \u0438\u043C\u044F \u0443\u0437\u043B\u0430, \u0447\u0442\u043E\u0431\u044B \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u0432\u0441\u0442\u0443\u043F\u0438\u043B\u0430 \u0432 \u0441\u0438\u043B\u0443."
  text_reporter_asset_settings_dropped: "\u041D\u0435\u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0441\u043E\u0445\u0440\u0430\u043D\u0451\u043D\u043D\u044B\u0435 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u043D\u0435 \u0443\u0434\u0430\u043B\u043E\u0441\u044C; \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u044E\u0442 \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E:"

