# T-31 - the aggregation degradations, as sentences rather than as raw symbols.
#
# `_degradations.html.erb` used to print `Degradation#to_s`: a code and an English sentence
# built in `lib/`. These eight keys are the codes T-31 introduced or inherited on that path;
# the remaining degradation codes still print raw and that gap is §Findings S-17, with the
# mechanism (a key per code, `data` as interpolation, `to_s` as the fallback) settled here.
#
# THE PLACEHOLDERS ARE THE DEGRADATION'S OWN `data` KEYS and are identical in all nine files.
# A key whose placeholder does not match its emit site raises
# `I18n::MissingInterpolationArgument`, which `reporter_degradation_text` catches into the raw
# fallback - so a mistake here loses the translation, never the message.

  text_reporter_degradation_aggregation_group_by_required: "Отчёт о трудозатратах нельзя свести без измерения. Добавьте group_by: в тег агрегации — например group_by: activity."
  text_reporter_degradation_aggregation_dimension_unknown: "Отчёт о трудозатратах нельзя группировать по %{group_by}."
  text_reporter_degradation_aggregation_measure_unknown: "%{measure} — не та величина, которую может вычислить отчёт о трудозатратах."
  text_reporter_degradation_aggregation_dimension_unavailable: "Для группировки по %{group_by} каждая запись должна быть связана со своей задачей, а это даёт только сохранённый запрос по трудозатратам. Выберите его для этого отчёта."
  text_reporter_degradation_aggregation_sort_unsupported: "Сортировка по %{sort} для трудозатрат недоступна, поэтому группы упорядочены по величине."
  text_reporter_degradation_aggregation_axis_truncated: "У %{group_by} слишком много значений: показано %{kept}, а %{folded} объединены."
  text_reporter_degradation_aggregation_params_unsupported: "%{params} нельзя использовать в отчёте о трудозатратах. Остальная часть агрегации вычислена."
  text_reporter_degradation_aggregation_source_unsupported: "Источник данных этого отчёта (%{source}) не может быть сведён тегом %{tag}."
  text_reporter_degradation_legacy_engine: "Отрисовано wkhtmltopdf — механизмом совместимости, подлежащим удалению; современный CSS не поддерживается."
  text_reporter_degradation_asset_structural_fallback: "Файл встроен в альтернативной форме, поскольку прямое встраивание изменило бы смысл документа."
  text_reporter_degradation_asset_srcset_collapsed: "Из нескольких размеров изображения использован только первый: у печатной страницы одно разрешение."
  text_reporter_degradation_asset_nested_depth: "Таблица стилей импортировала другие глубже допустимого; самый глубокий импорт не был встроен."
  text_reporter_degradation_asset_inline_oversize: "Файл сверх порога встраивания всё равно был встроен, поскольку этот механизм отрисовки не может передавать файлы отдельно от документа."
  text_reporter_degradation_asset_document_cap: "Этот отчёт ссылается на большее число файлов, чем можно встроить в один документ; остальные не включены."

