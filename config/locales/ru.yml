  label_reporter_preflight_check: "Проверка"
  label_reporter_preflight_detail: "Подробности"
  label_reporter_preflight_state_pass: "Пройдена"
  label_reporter_preflight_state_fail: "Не пройдена"
  label_reporter_preflight_state_skip: "Не удалось выполнить"
  label_reporter_preflight_state_expected_failure: "Ожидаемая ошибка"
