  label_reporter_preflight_check_footer: "Stopka z numerem strony jest tworzona i numerowana"
  label_reporter_preflight_check_background: "Tła są drukowane, dzięki czemu plakietki zachowują swój kolor"
  label_reporter_preflight_check_inline_asset: "Obraz osadzony jest dekodowany we właściwym kolorze"
  label_reporter_preflight_check_javascript: "JavaScript jest wykonywany, dzięki czemu wykresy mogą zostać narysowane"
  label_reporter_preflight_check_readiness: "Skrypt gotowości jest ładowany, dzięki czemu strona bez wykresów nie czeka"
  label_reporter_preflight_check_hosted_asset: "Obraz hostowany przez Redmine jest blokowany (oczekiwane: renderer nie ma dostępu do sieci)"
  label_reporter_asset_policy: "Polityka zasob\u00F3w"
  label_reporter_asset_policy_bundled: "Wbudowane \u2014 nic nie jest pobierane z sieci (domy\u015Blnie)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 pobieraj tylko z tej instalacji"
  label_reporter_asset_policy_external: "Zewn\u0119trzne \u2014 pobieraj tylko z host\u00F3w z listy dozwolonych"
  text_reporter_asset_policy_info: "Spos\u00F3b pozyskiwania obraz\u00F3w, arkuszy styl\u00F3w, czcionek i skrypt\u00F3w, do kt\u00F3rych odwo\u0142uje si\u0119 raport. \u201EWbudowane\u201D czyta je z dysku i osadza w dokumencie, wi\u0119c silnik renderuj\u0105cy nigdy nie si\u0119ga do sieci. Dwie pozosta\u0142e opcje s\u0105 ustawieniami tej instalacji, a nigdy pojedynczego szablonu: autor raportu nie mo\u017Ce ich rozszerzy\u0107, edytuj\u0105c dokument."
  label_reporter_asset_allowlist: "Lista dozwolonych host\u00F3w zasob\u00F3w"
  text_reporter_asset_allowlist_info: "Jedna nazwa hosta w ka\u017Cdym wierszu. Wy\u0142\u0105cznie nazwy host\u00F3w \u2014 bez schematu, portu, \u015Bcie\u017Cki i znak\u00F3w wieloznacznych. Pozostawienie pustego pola sprawia, \u017Ce ka\u017Cda polityka dzia\u0142a dok\u0142adnie jak \u201EWbudowane\u201D, wi\u0119c niedoko\u0144czona konfiguracja nie otworzy przypadkiem dost\u0119pu do sieci."
  label_reporter_asset_inline_max_bytes: "Osadzaj zasoby do (bajt\u00F3w)"
  text_reporter_asset_inline_max_bytes_info: "Powy\u017Cej tego rozmiaru zas\u00F3b jest przesy\u0142any obok dokumentu, a nie osadzany w nim \u2014 na silnikach, kt\u00F3re to obs\u0142uguj\u0105. To ustawienie kosztu, a nie limit."
  label_reporter_asset_max_bytes: "Odrzucaj zasoby powy\u017Cej (bajt\u00F3w)"
  text_reporter_asset_max_bytes_info: "Twardy limit. Wi\u0119kszy zas\u00F3b zostaje odrzucony i raport go nazywa, zamiast zosta\u0107 wygenerowany z luk\u0105."
  text_reporter_asset_policy_collapsed: "Lista dozwolonych host\u00F3w jest pusta, wi\u0119c %{mode} zachowuje si\u0119 obecnie dok\u0142adnie jak \u201EWbudowane\u201D i nic nie jest pobierane z sieci. Dodaj co najmniej jedn\u0105 nazw\u0119 hosta, aby ustawienie zadzia\u0142a\u0142o."
  text_reporter_asset_settings_dropped: "Niekt\u00F3rych zapisanych warto\u015Bci nie uda\u0142o si\u0119 u\u017Cy\u0107; obowi\u0105zuj\u0105 warto\u015Bci domy\u015Blne:"

