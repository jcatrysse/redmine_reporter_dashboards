  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Verifica preliminare del rendering"
  text_reporter_preflight_intro: "Genera un documento di prova con ogni motore di rendering installato e riporta ciò che è realmente arrivato nel PDF: interruzioni di pagina, il piè di pagina con il numero di pagina, i colori di sfondo, un'immagine incorporata e il percorso JavaScript. Sono proprio le domande a cui un motore presente e apparentemente sano può comunque rispondere in modo errato."
  text_reporter_preflight_takes_a_moment: "Viene avviato un motore reale e atteso un documento reale, quindi richiede alcuni secondi per motore."
  button_reporter_preflight_run: "Esegui la verifica"
  text_reporter_preflight_no_engine: "Nessun motore di rendering è registrato, quindi non è stato verificato nulla. In questo stato non è possibile produrre alcun report."
  text_reporter_preflight_ok: "Tutti i controlli sono stati superati."
  text_reporter_preflight_problems: "%{count} controllo/i non superato/i."
  text_reporter_preflight_incomplete: "Nulla è fallito, ma %{count} controllo/i non è stato possibile eseguirlo. Vedere i dettagli qui sotto."
