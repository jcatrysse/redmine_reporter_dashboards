  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Verifica preliminare del rendering"
  text_reporter_preflight_intro: "Genera un documento di prova con ogni motore di rendering installato e riporta ciò che è realmente arrivato nel PDF: interruzioni di pagina, il piè di pagina con il numero di pagina, i colori di sfondo, un'immagine incorporata e il percorso JavaScript. Sono proprio le domande a cui un motore presente e apparentemente sano può comunque rispondere in modo errato."
  text_reporter_preflight_takes_a_moment: "Viene avviato un motore reale e atteso un documento reale, quindi richiede alcuni secondi per motore."
  button_reporter_preflight_run: "Esegui la verifica"
  text_reporter_preflight_no_engine: "Nessun motore di rendering è registrato, quindi non è stato verificato nulla. In questo stato non è possibile produrre alcun report."
  text_reporter_preflight_ok: "Tutti i controlli sono stati superati."
  text_reporter_preflight_problems: "%{count} controllo/i non superato/i."
  text_reporter_preflight_incomplete: "Nulla è fallito, ma %{count} controllo/i non è stato possibile eseguirlo. Vedere i dettagli qui sotto."
  label_reporter_preflight_engine_version: "Versione del motore"
  label_reporter_preflight_duration: "Durata"
  label_reporter_preflight_state: "Stato"
  label_reporter_preflight_check: "Controllo"
  label_reporter_preflight_detail: "Dettagli"
  label_reporter_preflight_state_pass: "Superato"
  label_reporter_preflight_state_fail: "Non superato"
  label_reporter_preflight_state_skip: "Non eseguibile"
  label_reporter_preflight_state_expected_failure: "Errore previsto"
  label_reporter_preflight_duration_ms: "%{count} ms"
  label_reporter_preflight_json: "Il report in JSON"
  text_reporter_preflight_json: "Copiate questo in una segnalazione di errore: indica esattamente cosa è stato eseguito e cosa è tornato."
  label_reporter_preflight_check_engine: "Il motore di rendering ha prodotto un documento"
  label_reporter_preflight_check_degradations: "Nulla è stato ridotto in modo silenzioso"
  label_reporter_preflight_check_page_breaks: "Le interruzioni di pagina producono più di una pagina"
  label_reporter_preflight_check_footer: "Il piè di pagina con il numero di pagina viene generato e numerato"
  label_reporter_preflight_check_background: "Gli sfondi vengono stampati, così i badge mantengono il loro colore"
  label_reporter_preflight_check_inline_asset: "Un'immagine incorporata viene decodificata con il colore corretto"
  label_reporter_preflight_check_javascript: "Il percorso JavaScript viene eseguito, così i grafici possono essere disegnati"
  label_reporter_preflight_check_readiness: "Lo script di prontezza viene caricato, così una pagina senza grafici non attende"
  label_reporter_preflight_check_hosted_asset: "Un'immagine ospitata da Redmine viene bloccata (previsto: il renderer non ha accesso alla rete)"
  label_reporter_asset_policy: "Politica delle risorse"
  label_reporter_asset_policy_bundled: "Incorporate \u2014 non viene scaricato nulla dalla rete (predefinito)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 scarica solo da questa installazione"
  label_reporter_asset_policy_external: "Esterno \u2014 scarica solo dagli host in elenco consentito"
  text_reporter_asset_policy_info: "Come vengono ottenute le immagini, i fogli di stile, i caratteri e gli script a cui un report fa riferimento. \u00ABIncorporate\u00BB li legge dal disco e li integra nel documento, cos\u00EC il motore di rendering non tocca mai la rete. Le altre due opzioni sono impostazioni di questa installazione e mai di un singolo modello: chi scrive un report non pu\u00F2 ampliarle modificando un documento."
  label_reporter_asset_allowlist: "Elenco host consentiti per le risorse"
  text_reporter_asset_allowlist_info: "Un nome host per riga. Solo nomi host: nessuno schema, nessuna porta, nessun percorso e nessun carattere jolly. Se il campo resta vuoto, ogni politica si comporta esattamente come \u00ABIncorporate\u00BB, cos\u00EC una configurazione incompleta non pu\u00F2 aprire per errore l\u2019accesso alla rete."
  label_reporter_asset_inline_max_bytes: "Incorpora risorse fino a (byte)"
  text_reporter_asset_inline_max_bytes_info: "Oltre questa dimensione la risorsa viaggia accanto al documento invece di essere incorporata, sui motori che lo supportano. \u00C8 un\u2019impostazione di costo, non un limite."
  label_reporter_asset_max_bytes: "Rifiuta risorse oltre (byte)"
  text_reporter_asset_max_bytes_info: "Un limite rigido. Una risorsa pi\u00F9 grande viene rifiutata e il report la nomina, invece di essere generato con un vuoto."
  text_reporter_asset_policy_collapsed: "L\u2019elenco host consentiti \u00E8 vuoto, quindi %{mode} si comporta attualmente esattamente come \u00ABIncorporate\u00BB e non viene scaricato nulla dalla rete. Aggiungere almeno un nome host perch\u00E9 abbia effetto."
  text_reporter_asset_settings_dropped: "Alcuni valori salvati non sono utilizzabili; sono in vigore i valori predefiniti:"
