  label_reporter_asset_policy_bundled: "Incorporate \u2014 non viene scaricato nulla dalla rete (predefinito)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 scarica solo da questa installazione"
  label_reporter_asset_policy_external: "Esterno \u2014 scarica solo dagli host in elenco consentito"
  text_reporter_asset_policy_info: "Come vengono ottenute le immagini, i fogli di stile, i caratteri e gli script a cui un report fa riferimento. \u00ABIncorporate\u00BB li legge dal disco e li integra nel documento, cos\u00EC il motore di rendering non tocca mai la rete. Le altre due opzioni sono impostazioni di questa installazione e mai di un singolo modello: chi scrive un report non pu\u00F2 ampliarle modificando un documento. Un riferimento che questa politica non può ottenere fa fallire l’intero report e ne indica l’URL; un report non viene mai prodotto con un’immagine mancante."
  label_reporter_asset_allowlist: "Elenco host consentiti per le risorse"
  text_reporter_asset_allowlist_info: "Un nome host per riga. Solo nomi host: nessuno schema, nessuna porta, nessun percorso e nessun carattere jolly. Se il campo resta vuoto, ogni politica si comporta esattamente come \u00ABIncorporate\u00BB, cos\u00EC una configurazione incompleta non pu\u00F2 aprire per errore l\u2019accesso alla rete."
  label_reporter_asset_inline_max_bytes: "Incorpora risorse fino a (byte)"
  text_reporter_asset_inline_max_bytes_info: "Oltre questa dimensione la risorsa viaggia accanto al documento invece di essere incorporata, sui motori che lo supportano. \u00C8 un\u2019impostazione di costo, non un limite."
  label_reporter_asset_max_bytes: "Rifiuta risorse oltre (byte)"
  text_reporter_asset_max_bytes_info: "Un limite rigido. Una risorsa più grande viene rifiutata: il report non viene prodotto e l’errore nomina la risorsa."
  text_reporter_asset_policy_collapsed: "L\u2019elenco host consentiti \u00E8 vuoto, quindi %{mode} si comporta attualmente esattamente come \u00ABIncorporate\u00BB e non viene scaricato nulla dalla rete. Aggiungere almeno un nome host perch\u00E9 abbia effetto."
