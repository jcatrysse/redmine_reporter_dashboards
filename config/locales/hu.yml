  label_reporter_preflight_duration_ms: "%{count} ms"
  label_reporter_preflight_json: "A jelentés JSON formátumban"
  text_reporter_preflight_json: "Másolja ezt egy hibajelentésbe — pontosan megmutatja, mi futott le és mi jött vissza."
  label_reporter_preflight_check_engine: "A renderelő motor létrehozott egy dokumentumot"
  label_reporter_preflight_check_degradations: "Semmi sem lett észrevétlenül lekorlátozva"
  label_reporter_preflight_check_page_breaks: "Az oldaltörések egynél több oldalt eredményeznek"
  label_reporter_preflight_check_footer: "Az oldalszámot tartalmazó élőláb elkészül és számozódik"
  label_reporter_preflight_check_background: "A hátterek nyomtatásra kerülnek, így a jelvények megtartják a színüket"
  label_reporter_preflight_check_inline_asset: "A beágyazott kép a helyes színnel dekódolódik"
  label_reporter_preflight_check_javascript: "A JavaScript lefut, így a diagramok kirajzolódhatnak"
  label_reporter_preflight_check_readiness: "A készenléti szkript betöltődik, így a diagram nélküli oldal nem vár"
  label_reporter_preflight_check_hosted_asset: "A Redmine által kiszolgált kép blokkolva van (várt: a renderelőnek nincs hálózati hozzáférése)"
  label_reporter_asset_policy: "Er\u0151forr\u00E1s-szab\u00E1lyzat"
  label_reporter_asset_policy_bundled: "Be\u00E9p\u00EDtett \u2014 semmi sem t\u00F6lt\u0151dik le a h\u00E1l\u00F3zatr\u00F3l (alap\u00E9rtelmezett)"
  label_reporter_asset_policy_redmine: "Redmine \u2014 let\u00F6lt\u00E9s csak err\u0151l a telep\u00EDt\u00E9sr\u0151l"
  label_reporter_asset_policy_external: "K\u00FCls\u0151 \u2014 let\u00F6lt\u00E9s csak az enged\u00E9lyez\u00E9si list\u00E1n szerepl\u0151 g\u00E9pekr\u0151l"
  text_reporter_asset_policy_info: "Hogyan szerzi meg a rendszer a jelent\u00E9s \u00E1ltal hivatkozott k\u00E9peket, st\u00EDluslapokat, bet\u0171t\u00EDpusokat \u00E9s szkripteket. A \u201EBe\u00E9p\u00EDtett\u201D a lemezr\u0151l olvassa \u00E9s a dokumentumba \u00E1gyazza \u0151ket, \u00EDgy a megjelen\u00EDt\u0151 motor soha nem ny\u00FAl a h\u00E1l\u00F3zathoz. A m\u00E1sik k\u00E9t \u00E9rt\u00E9k ennek a telep\u00EDt\u00E9snek a be\u00E1ll\u00EDt\u00E1sa, \u00E9s soha nem egyetlen sablon\u00E9t: a jelent\u00E9s szerz\u0151je nem b\u0151v\u00EDtheti ki \u0151ket egy dokumentum szerkeszt\u00E9s\u00E9vel."
  label_reporter_asset_allowlist: "Enged\u00E9lyezett er\u0151forr\u00E1s-g\u00E9pek list\u00E1ja"
  text_reporter_asset_allowlist_info: "Soronk\u00E9nt egy g\u00E9pn\u00E9v. Csak g\u00E9pnevek \u2014 s\u00E9ma, port, \u00FAtvonal \u00E9s helyettes\u00EDt\u0151 karakterek n\u00E9lk\u00FCl. Ha \u00FCresen hagyja, minden szab\u00E1lyzat pontosan \u00FAgy m\u0171k\u00F6dik, mint a \u201EBe\u00E9p\u00EDtett\u201D, \u00EDgy egy f\u00E9lbehagyott be\u00E1ll\u00EDt\u00E1s nem nyitja meg v\u00E9letlen\u00FCl a h\u00E1l\u00F3zati hozz\u00E1f\u00E9r\u00E9st."
  label_reporter_asset_inline_max_bytes: "Er\u0151forr\u00E1sok be\u00E1gyaz\u00E1sa eddig (b\u00E1jt)"
  text_reporter_asset_inline_max_bytes_info: "E m\u00E9ret felett az er\u0151forr\u00E1s a dokumentum mellett utazik, nem pedig be\u00E1gyazva \u2014 azokon a motorokon, amelyek ezt t\u00E1mogatj\u00E1k. Ez k\u00F6lts\u00E9gbe\u00E1ll\u00EDt\u00E1s, nem korl\u00E1t."
  label_reporter_asset_max_bytes: "Er\u0151forr\u00E1sok elutas\u00EDt\u00E1sa e felett (b\u00E1jt)"
  text_reporter_asset_max_bytes_info: "Szigor\u00FA korl\u00E1t. Az enn\u00E9l nagyobb er\u0151forr\u00E1st a rendszer elutas\u00EDtja, \u00E9s a jelent\u00E9s megnevezi, ahelyett hogy hi\u00E1nnyal k\u00E9sz\u00FClne el."
  text_reporter_asset_policy_collapsed: "Az enged\u00E9lyezett g\u00E9pek list\u00E1ja \u00FCres, ez\u00E9rt a %{mode} jelenleg pontosan \u00FAgy m\u0171k\u00F6dik, mint a \u201EBe\u00E9p\u00EDtett\u201D, \u00E9s semmi sem t\u00F6lt\u0151dik le a h\u00E1l\u00F3zatr\u00F3l. Adjon meg legal\u00E1bb egy g\u00E9pnevet, hogy \u00E9rv\u00E9nybe l\u00E9pjen."
  text_reporter_asset_settings_dropped: "N\u00E9h\u00E1ny mentett \u00E9rt\u00E9k nem haszn\u00E1lhat\u00F3; helyett\u00FCk az alap\u00E9rtelmez\u00E9sek vannak \u00E9rv\u00E9nyben:"

