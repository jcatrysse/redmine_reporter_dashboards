  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Renderelési előellenőrzés"
  text_reporter_preflight_intro: "Egy próbadokumentumot renderel minden telepített renderelő motorral, és jelenti, mi került ténylegesen a PDF-be: oldaltörések, az oldalszámot tartalmazó élőláb, a háttérszínek, egy beágyazott kép és a JavaScript futása. Pontosan ezekre a kérdésekre adhat rossz választ egy telepített és látszólag hibátlan motor is."
  text_reporter_preflight_takes_a_moment: "Ez valódi motort indít és valódi dokumentumra vár, ezért motoronként néhány másodpercet vesz igénybe."
  button_reporter_preflight_run: "Előellenőrzés futtatása"
  text_reporter_preflight_no_engine: "Nincs regisztrált renderelő motor, ezért semmi sem lett ellenőrizve. Ebben az állapotban nem készíthető jelentés."
  text_reporter_preflight_ok: "Minden ellenőrzés sikeres."
  text_reporter_preflight_problems: "%{count} ellenőrzés sikertelen."
  text_reporter_preflight_incomplete: "Semmi sem hiúsult meg, de %{count} ellenőrzést nem lehetett lefuttatni. A részleteket lásd alább."
