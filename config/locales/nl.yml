  label_reporter_preflight_state_expected_failure: "Verwachte fout"
  label_reporter_preflight_duration_ms: "%{count} ms"
  label_reporter_preflight_json: "Het rapport als JSON"
  text_reporter_preflight_json: "Kopieer dit in een bugrapport — het zegt precies wat er is uitgevoerd en wat er terugkwam."
  label_reporter_preflight_check_gotenberg_endpoint: "Er is een adres geconfigureerd voor de renderdienst"
  label_reporter_preflight_check_gotenberg_reachable: "De renderdienst antwoordt, en is een Gotenberg"
  label_reporter_preflight_check_gotenberg_credential: "De renderdienst handhaaft zijn inloggegevens"
  label_reporter_preflight_check_gotenberg_version: "De renderdienst is Gotenberg 8 of later"
  label_reporter_preflight_check_gotenberg_javascript: "De renderdienst heeft JavaScript ingeschakeld, zodat grafieken kunnen tekenen"
  label_reporter_preflight_check_engine_not_selected: "De render-engine heeft een dienst nodig en is niet de geselecteerde engine van deze installatie"
  label_reporter_preflight_check_engine_configuration: "De engine kon naar zijn configuratie worden gevraagd"
  label_reporter_preflight_check_engine: "De render-engine heeft een document geproduceerd"
  label_reporter_preflight_check_degradations: "Er is niets stilzwijgend afgezwakt"
  label_reporter_preflight_check_page_breaks: "Pagina-einden leveren meer dan één pagina op"
  label_reporter_preflight_check_footer: "De voettekst met paginanummers wordt samengesteld en genummerd"
  label_reporter_preflight_check_background: "Achtergronden worden afgedrukt, zodat badges hun kleur houden"
  label_reporter_preflight_check_inline_asset: "Een ingebedde afbeelding decodeert naar de juiste kleur"
  label_reporter_preflight_check_javascript: "Het JavaScript-pad werkt, zodat grafieken kunnen tekenen"
  label_reporter_preflight_check_readiness: "De readiness-shell laadt, zodat een pagina zonder grafiek niet wacht"
  label_reporter_preflight_check_hosted_asset: "Een door Redmine gehoste afbeelding wordt geblokkeerd (verwacht: de renderer heeft geen netwerktoegang)"
  label_reporter_authoring_audit: "Sjablonen schrijven — wie servercode mag uitvoeren"
  text_reporter_authoring_audit_intro: "Een rapportsjabloon wordt op de server uitgevoerd, dus de rechten om er een te schrijven zijn de rechten om code uit te voeren. Elke rol die de inhoud van een sjabloon kan aanmaken of wijzigen staat hier — die van deze plugin en die van de basisrapportageplugin. Rechten die alleen de zichtbaarheid van een sjabloon verbreden staan er niet bij: die kunnen op zichzelf geen sjabloon schrijven. Een toekenning overleeft de plugin die haar registreerde, dus een rol kan hier nog opduiken nadat die plugin verwijderd is."
  text_reporter_authoring_audit_none: "Geen enkele rol kan een rapportsjabloon aanmaken of wijzigen. Op deze installatie kunnen alleen beheerders rapportsjablonen schrijven."
  label_reporter_authoring_audit_role: "Rol"
  label_reporter_authoring_audit_base: "Basisrapportageplugin"
  label_reporter_authoring_audit_own: "Deze plugin"
  label_reporter_authoring_audit_verdict: "Wat dit betekent"
  text_reporter_authoring_audit_both: "Schrijft in beide plugins. Er valt niets te beslissen."
  text_reporter_authoring_audit_only_base: "Schrijft alleen in de basisplugin. Deze gebruikers schrijven vandaag sjablonen en zullen dat hier niet kunnen — ken hun aan deze kant een recht toe, of beslis dat zij niet langer sjablonen schrijven."
  text_reporter_authoring_audit_only_own: "Schrijft alleen in deze plugin. Ga na of dit de bedoeling was: Redmine kent de rol Manager elk beschikbaar recht toe wanneer het zijn standaardconfiguratie laadt, dus dit kan verschijnen zonder dat iemand het gekozen heeft."
  text_reporter_authoring_audit_builtin: "(ingebouwde rol — geldt voor gebruikers die geen lid zijn van het project)"
  label_reporter_asset_policy: "Assetbeleid"
  label_reporter_asset_policy_bundled: "Gebundeld — er wordt niets over het netwerk opgehaald (standaard)"
  label_reporter_asset_policy_redmine: "Redmine — alleen ophalen vanaf deze installatie"
  label_reporter_asset_policy_external: "Extern — alleen ophalen vanaf hosts op de toegestane lijst"
  text_reporter_asset_policy_info: "Hoe de afbeeldingen, stylesheets, lettertypen en scripts waarnaar een rapport verwijst worden verkregen. Gebundeld leest ze van schijf en bedt ze in, zodat de render-engine het netwerk nooit aanraakt. De andere twee zijn instellingen voor deze installatie en nooit voor een sjabloon: een rapportauteur kan ze niet verbreden door een document te bewerken. Een verwijzing die dit beleid niet kan verkrijgen laat het hele rapport mislukken en noemt de URL; er wordt nooit een rapport geproduceerd waarin een afbeelding ontbreekt."
  label_reporter_asset_allowlist: "Toegestane assethosts"
  text_reporter_asset_allowlist_info: "Eén hostnaam per regel. Alleen hostnamen — geen schema, geen poort, geen pad en geen jokertekens. Als u dit leeg laat, gedraagt elk beleid zich exact als Gebundeld, zodat een halfafgewerkte configuratie niet per ongeluk netwerktoegang kan openen."
  label_reporter_asset_inline_max_bytes: "Assets inbedden tot (bytes)"
  text_reporter_asset_inline_max_bytes_info: "Boven deze grootte reist een asset naast het document mee in plaats van erin ingebed te worden, op engines die dat ondersteunen. Dit is een kosteninstelling, geen limiet."
  label_reporter_asset_max_bytes: "Assets weigeren boven (bytes)"
  text_reporter_asset_max_bytes_info: "Een harde limiet. Een asset die groter is wordt geweigerd: het rapport wordt niet geproduceerd, en de fout noemt de asset."
  text_reporter_asset_policy_collapsed: "De lijst met toegestane assethosts is leeg, dus %{mode} gedraagt zich nu exact als Gebundeld en er wordt niets over het netwerk opgehaald. Voeg minstens één hostnaam toe om het te laten werken."
  text_reporter_asset_settings_dropped: "Sommige opgeslagen waarden konden niet worden gebruikt; in plaats daarvan gelden de standaardwaarden:"

