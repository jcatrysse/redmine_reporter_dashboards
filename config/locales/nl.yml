# T-31 - the aggregation degradations, as sentences rather than as raw symbols.
#
# `_degradations.html.erb` used to print `Degradation#to_s`: a code and an English sentence
# built in `lib/`. These eight keys are the codes T-31 introduced or inherited on that path;
# the remaining degradation codes still print raw and that gap is §Findings S-17, with the
# mechanism (a key per code, `data` as interpolation, `to_s` as the fallback) settled here.
#
# THE PLACEHOLDERS ARE THE DEGRADATION'S OWN `data` KEYS and are identical in all twelve files.
# A key whose placeholder does not match its emit site raises
# `I18n::MissingInterpolationArgument`, which `reporter_degradation_text` catches into the raw
# fallback - so a mistake here loses the translation, never the message.

  text_reporter_degradation_aggregation_group_by_required: "Een rapport over gespendeerde tijd kan niet worden samengevat zonder dimensie. Voeg group_by: toe aan de aggregatietag — bijvoorbeeld group_by: activity."
  text_reporter_degradation_aggregation_dimension_unknown: "%{group_by} is niets waarop een rapport over gespendeerde tijd kan worden gegroepeerd."
  text_reporter_degradation_aggregation_measure_unknown: "%{measure} is niets wat een rapport over gespendeerde tijd kan meten."
  text_reporter_degradation_aggregation_dimension_unavailable: "Groeperen op %{group_by} vereist dat elke registratie aan haar issue is gekoppeld, en dat levert alleen een opgeslagen tijdquery. Kies er een voor dit rapport."
  text_reporter_degradation_aggregation_sort_unsupported: "Sorteren op %{sort} is niet beschikbaar voor gespendeerde tijd, dus de buckets zijn op grootte geordend."
  text_reporter_degradation_aggregation_axis_truncated: "%{group_by} heeft te veel waarden om te tonen: %{kept} staan er, %{folded} zijn samengevouwen."
  text_reporter_degradation_aggregation_params_unsupported: "%{params} kan niet worden gebruikt in een rapport over gespendeerde tijd. De rest van de aggregatie is berekend."
  text_reporter_degradation_aggregation_query_id_unresolved: "Er is geen opgeslagen query gevonden voor query_id: %{query_id}, dus er is niets geteld. Onthoud dat een waarde tussen aanhalingstekens letterlijke tekst is — schrijf ze zonder aanhalingstekens om een variabele te lezen."
  text_reporter_degradation_aggregation_source_unsupported: "De gegevensbron van dit rapport (%{source}) kan niet worden samengevat door %{tag}."
  text_reporter_degradation_legacy_engine: "Getekend door wkhtmltopdf, een compatibiliteitsengine die zal worden verwijderd; moderne CSS wordt niet ondersteund."
  text_reporter_degradation_asset_structural_fallback: "Een bestand is in een alternatieve vorm ingebed, omdat het rechtstreeks inbedden de betekenis van het document zou hebben veranderd."
  text_reporter_degradation_asset_srcset_collapsed: "Slechts de eerste van meerdere afbeeldingsformaten is gebruikt: een afgedrukte pagina heeft één resolutie."
  text_reporter_degradation_asset_nested_depth: "Een stylesheet importeerde andere dieper dan is toegestaan; de diepste import is niet ingebed."
  text_reporter_degradation_asset_inline_oversize: "Een bestand boven de inbeddingsdrempel is alsnog ingebed, omdat deze render-engine geen bestanden naast het document kan meesturen."
  text_reporter_degradation_asset_document_cap: "Dit rapport verwijst naar meer bestanden dan er in één document kunnen worden ingebed; de rest is weggelaten."

