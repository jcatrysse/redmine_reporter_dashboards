  # T-14 - the render preflight (admin page). Keyed on Check#id, never on the
  # English title the render layer carries: the id is a contract, the title is prose.
  label_reporter_preflight: "Rendercontrole"
  text_reporter_preflight_intro: "Rendert een proefdocument door elke geïnstalleerde render-engine en rapporteert wat er werkelijk in de PDF is aangekomen: pagina-einden, de voettekst met paginanummers, achtergrondkleuren, een ingebedde afbeelding en het JavaScript-pad. Precies deze vragen kan een aanwezige, ogenschijnlijk gezonde engine alsnog verkeerd beantwoorden."
  text_reporter_preflight_takes_a_moment: "Hierbij wordt een echte engine gestart die een echt document oplevert, dus dit duurt enkele seconden per engine."
  button_reporter_preflight_run: "Controle uitvoeren"
  label_reporter_preflight_engine: "Engine"
  label_reporter_preflight_engine_default: "Elke engine die geen dienst nodig heeft (de standaard)"
  text_reporter_preflight_unknown_engine: "Onder die naam is geen render-engine geregistreerd. Bekende engines: %{engines}."
  text_reporter_preflight_no_engine: "Er is geen render-engine geregistreerd, dus er is niets gecontroleerd. In deze toestand kan er geen rapport worden geproduceerd."
  text_reporter_preflight_ok: "Alle controles zijn geslaagd."
  text_reporter_preflight_problems: "%{count} controle(s) mislukt."
  text_reporter_preflight_incomplete: "Er is niets mislukt, maar %{count} controle(s) konden niet worden uitgevoerd. Zie de details hieronder."
