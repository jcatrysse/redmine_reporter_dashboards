  label_reporter_preflight: "渲染预检"
  text_reporter_preflight_intro: "使用每个已安装的渲染引擎生成一份探测文档，并报告实际进入 PDF 的内容：分页、页码页脚、背景颜色、内嵌图片以及 JavaScript 执行路径。这些正是一个已安装且看似正常的引擎仍可能答错的问题。"
  text_reporter_preflight_takes_a_moment: "该操作会启动真实引擎并等待真实文档，因此每个引擎需要几秒钟。"
  button_reporter_preflight_run: "运行预检"
  text_reporter_preflight_no_engine: "未注册任何渲染引擎，因此未验证任何内容。在此状态下无法生成报告。"
  text_reporter_preflight_ok: "所有检查均已通过。"
