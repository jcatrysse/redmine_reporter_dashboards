  text_reporter_asset_policy_info: "\u62A5\u8868\u6240\u5F15\u7528\u7684\u56FE\u7247\u3001\u6837\u5F0F\u8868\u3001\u5B57\u4F53\u548C\u811A\u672C\u5982\u4F55\u83B7\u53D6\u3002\u201C\u5185\u7F6E\u201D\u4ECE\u78C1\u76D8\u8BFB\u53D6\u5E76\u5D4C\u5165\u6587\u6863\uFF0C\u56E0\u6B64\u6E32\u67D3\u5F15\u64CE\u5B8C\u5168\u4E0D\u63A5\u89E6\u7F51\u7EDC\u3002\u53E6\u5916\u4E24\u9879\u662F\u672C\u5B89\u88C5\u7684\u8BBE\u7F6E\uFF0C\u800C\u4E0D\u662F\u5355\u4E2A\u6A21\u677F\u7684\u8BBE\u7F6E\uFF1A\u62A5\u8868\u4F5C\u8005\u65E0\u6CD5\u901A\u8FC7\u7F16\u8F91\u6587\u6863\u6765\u653E\u5BBD\u5B83\u4EEC\u3002"
  label_reporter_asset_allowlist: "\u8D44\u6E90\u4E3B\u673A\u5141\u8BB8\u5217\u8868"
  text_reporter_asset_allowlist_info: "\u6BCF\u884C\u4E00\u4E2A\u4E3B\u673A\u540D\u3002\u4EC5\u586B\u4E3B\u673A\u540D \u2014 \u4E0D\u8981\u534F\u8BAE\u3001\u7AEF\u53E3\u3001\u8DEF\u5F84\u6216\u901A\u914D\u7B26\u3002\u7559\u7A7A\u65F6\uFF0C\u4EFB\u4F55\u7B56\u7565\u90FD\u4E0E\u201C\u5185\u7F6E\u201D\u5B8C\u5168\u4E00\u81F4\uFF0C\u8FD9\u6837\u672A\u5B8C\u6210\u7684\u914D\u7F6E\u5C31\u4E0D\u4F1A\u610F\u5916\u5F00\u653E\u7F51\u7EDC\u8BBF\u95EE\u3002"
  label_reporter_asset_inline_max_bytes: "\u5D4C\u5165\u4E0D\u8D85\u8FC7\uFF08\u5B57\u8282\uFF09\u7684\u8D44\u6E90"
  text_reporter_asset_inline_max_bytes_info: "\u8D85\u8FC7\u6B64\u5927\u5C0F\u7684\u8D44\u6E90\u5C06\u4E0E\u6587\u6863\u4E00\u8D77\u4F20\u9001\u800C\u4E0D\u662F\u5D4C\u5165\u5176\u4E2D\uFF08\u5728\u652F\u6301\u8BE5\u65B9\u5F0F\u7684\u5F15\u64CE\u4E0A\uFF09\u3002\u8FD9\u662F\u6210\u672C\u8BBE\u7F6E\uFF0C\u4E0D\u662F\u9650\u5236\u3002"
  label_reporter_asset_max_bytes: "\u62D2\u7EDD\u8D85\u8FC7\uFF08\u5B57\u8282\uFF09\u7684\u8D44\u6E90"
  text_reporter_asset_max_bytes_info: "\u786C\u6027\u4E0A\u9650\u3002\u8D85\u8FC7\u8BE5\u5927\u5C0F\u7684\u8D44\u6E90\u5C06\u88AB\u62D2\u7EDD\uFF0C\u5E76\u5728\u62A5\u8868\u4E2D\u6307\u51FA\uFF0C\u800C\u4E0D\u662F\u751F\u6210\u4E00\u4EFD\u5E26\u6709\u7A7A\u7F3A\u7684\u62A5\u8868\u3002"
  text_reporter_asset_policy_collapsed: "\u8D44\u6E90\u4E3B\u673A\u5141\u8BB8\u5217\u8868\u4E3A\u7A7A\uFF0C\u56E0\u6B64 %{mode} \u76EE\u524D\u4E0E\u201C\u5185\u7F6E\u201D\u5B8C\u5168\u4E00\u81F4\uFF0C\u4E0D\u4F1A\u901A\u8FC7\u7F51\u7EDC\u83B7\u53D6\u4EFB\u4F55\u5185\u5BB9\u3002\u8BF7\u81F3\u5C11\u6DFB\u52A0\u4E00\u4E2A\u4E3B\u673A\u540D\u4F7F\u5176\u751F\u6548\u3002"
