  label_reporter_preflight_state_pass: "通过"
  label_reporter_preflight_state_fail: "失败"
  label_reporter_preflight_state_skip: "无法运行"
  label_reporter_preflight_state_expected_failure: "预期内的失败"
  label_reporter_preflight_duration_ms: "%{count} 毫秒"
  label_reporter_preflight_json: "JSON 格式的报告"
  text_reporter_preflight_json: "请将此内容复制到问题报告中——它准确说明了运行了什么以及返回了什么。"
  label_reporter_preflight_check_engine: "渲染引擎生成了文档"
  label_reporter_preflight_check_degradations: "没有任何功能被静默降级"
  label_reporter_preflight_check_page_breaks: "分页产生了多于一页"
  label_reporter_preflight_check_footer: "页码页脚已生成并正确编号"
